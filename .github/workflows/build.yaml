name: Build and Deploy
on:
  push:
    branches: 
      - staging
      - feature/*

permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

jobs: 
  build-deploy:
    environment: ${{ github.ref == 'refs/heads/staging' && 'staging' || 'dev' }}
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: AWS Login
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: us-east-1
          role-to-assume: ${{vars.AWS_ROLE_ARN}}
          role-session-name: gha-session

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          #logging to the tooling AWS account to push images to ECR
          registries: "374198398764"

      - name: Get short sha
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build, tag, and push docker image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: shipments-api
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Update kubeconfig
        env:
          CLUSTER_NAME: ${{ github.ref == 'refs/heads/main' && 'routebox-prod' || github.ref == 'refs/heads/staging' && 'routebox-staging' || 'routebox-dev' }}
        run: |
          aws eks update-kubeconfig --name $CLUSTER_NAME

      - name: Create ECR pull secret
        run: |
          kubectl create namespace shipments-api --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic ecr-pull-secret \
            --from-file=.dockerconfigjson=$HOME/.docker/config.json \
            --type=kubernetes.io/dockerconfigjson \
            --namespace=shipments-api \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to k8s/EKS with Helm
        env:
          VALUES_FILE: ${{ github.ref == 'refs/heads/main' && 'prod' || github.ref == 'refs/heads/staging' && 'staging' || 'dev' }}-values.yaml
        run: |
          cat > /tmp/secret-values.yaml << EOF
          secrets:
            DATABASE_URL: "${{ secrets.DATABASE_URL }}"
            JWT_SIGNING_KEY: "${{ secrets.JWT_SIGNING_KEY }}"
            INTERNAL_API_TOKEN: "${{ secrets.INTERNAL_API_TOKEN }}"
          EOF

          helm upgrade --install routebox-shipments-api ./helm \
            --namespace shipments-api \
            --create-namespace \
            --values helm/$VALUES_FILE \
            --values /tmp/secret-values.yaml \
            --set image.tag=$IMAGE_TAG \
            --wait
#
