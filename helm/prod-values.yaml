fullname: routebox-shipments-api

replicaCount: 3

image:
  repository: 374198398764.dkr.ecr.us-east-1.amazonaws.com/shipments-api
  tag: latest
  pullPolicy: IfNotPresent

namespace: shipments-api

service:
  type: ClusterIP
  port: 3000

config:
  PORT: "3000"
  LOG_LEVEL: warn
  AWS_REGION: us-east-1
  SQS_QUEUE_URL: "https://sqs.us-east-1.amazonaws.com/414866527708/routebox-prod-shipments"

secrets:
  DATABASE_URL: ""
  JWT_SIGNING_KEY: ""
  INTERNAL_API_TOKEN: ""

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

livenessProbe:
  httpGet:
    path: /healthz
    port: 3000
  initialDelaySeconds: 20
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: 3000
  initialDelaySeconds: 20
  periodSeconds: 10
  failureThreshold: 2
