apiVersion: v1
kind: ConfigMap
metadata:
  name: routebox-shipments-config
  namespace: {{ .Values.namespace }}
data:
  PORT: {{ .Values.config.PORT | quote }}
  LOG_LEVEL: {{ .Values.config.LOG_LEVEL }}
  AWS_REGION: {{ .Values.config.AWS_REGION }}
  SQS_QUEUE_URL: {{ .Values.config.SQS_QUEUE_URL | quote }}
