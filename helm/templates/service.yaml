apiVersion: v1
kind: Service
metadata:
  name: routebox-shipments-api
  namespace: {{ .Values.namespace }}
  labels:
    app: routebox-shipments-api
spec:
  selector:
    app: routebox-shipments-api
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
  type: {{ .Values.service.type }}
