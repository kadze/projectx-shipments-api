apiVersion: v1
kind: Secret
metadata:
  name: routebox-shipments-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.DATABASE_URL | quote }}
  JWT_SIGNING_KEY: {{ .Values.secrets.JWT_SIGNING_KEY | quote }}
  INTERNAL_API_TOKEN: {{ .Values.secrets.INTERNAL_API_TOKEN | quote }}
