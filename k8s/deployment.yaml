apiVersion: apps/v1
kind: Deployment
metadata:
  name: routebox-shipments-api
  namespace: shipments-api
  labels:
    app: routebox-shipments-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: routebox-shipments-api
  template:
    metadata:
      labels:
        app: routebox-shipments-api
    spec:
      containers:
        - name: routebox-shipments-api
          image: 414866527708.dkr.ecr.us-east-1.amazonaws.com/shipments-api:20d7f6b
          #command: ["/bin/sh", "-c", "sleep 600"] 
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: routebox-shipments-config
            - secretRef:
                name: routebox-shipments-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
